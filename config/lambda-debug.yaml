# Lambda debug configuration for LocalStack Lambda Debug Mode (Pro).
# Used when LAMBDA_DEBUG_MODE=1 and LAMBDA_DEBUG_MODE_CONFIG_PATH is set.
# Community LocalStack uses LAMBDA_DOCKER_FLAGS instead (see compose/localstack-debug.yml).
#
# Per-function debug ports (required for multi-function debugging):
functions:
  arn:aws:lambda:us-east-1:000000000000:function:hello-lambda:
    debug-port: 19891
  arn:aws:lambda:us-east-1:000000000000:function:health-lambda:
    debug-port: 19892
